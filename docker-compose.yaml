services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: my-notebook-llm-postgres
    environment:
      POSTGRES_DB: my-notebook-llm-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5433:5432"
    volumes:
      - my_notebook_llm_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d my-notebook-llm-db"]
      interval: 5s
      timeout: 5s
      retries: 5
  
volumes:
  my_notebook_llm_data: